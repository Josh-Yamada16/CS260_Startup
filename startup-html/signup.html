<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DnD Character Builder</title>
    <link rel="icon" href="favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
    rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
    crossorigin="anonymous">

    <link rel="stylesheet" href="main.css" />
</head>

<body>
    <!-- Use header, main, and footer elements to give semantic structure -->
    <header>
    </header>

    <main>
        <h1>Welcome to DnD Character Builder</h1>
        <form method="get" action="home.html">
            <h5>Create your account.</h5>
            <div class="mb-3">
                <label for="exampleDropdownFormUsername" class="form-label">Username</label>
                <input type="text" class="form-control" id="exampleDropdownFormUsername" placeholder="username" style="width: 40%">
            </div>
            <div class="mb-3">
                <label for="exampleDropdownFormEmail1" class="form-label">Email address</label>
                <input type="email" class="form-control" id="exampleDropdownFormEmail1" placeholder="email@example.com" style="width: 40%">
            </div>
            <div class="mb-3">
                <!-- put in functionality for being able to show/hide password -->
                <label for="exampleDropdownFormPassword1" class="form-label">Password</label>
                <input type="password" class="form-control" id="exampleDropdownFormPassword1" placeholder="Password" style="width: 40%">
            </div>
            <div class="mb-3">
                <label for="exampleDropdownFormPassword2" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="exampleDropdownFormPassword2" placeholder="Confirm Password" style="width: 40%">
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Register</button>
            <a href="index.html">Already have an account?</a>
        </form>
    </main>

    <footer>
        <hr />
        <span class="text-reset">Josh Yamada</span>
        <br />
        <a href="https://github.com/Josh-Yamada16/CS260_Startup">GitHub</a>
    </footer>
</body>

</html>
