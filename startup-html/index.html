<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DnD Character Builder</title>
    <link rel="icon" href="favicon.ico" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
    rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
    crossorigin="anonymous">

    <link rel="stylesheet" href="index.css" />
</head>

<body class="login-page">
    <main>
        <div class="row">
            <!-- left side -->
            <div class="col-6 left">
                <h1>Start Your Adventure Here</h1>
                <p>Create and design your own D&D character or explore and be inspired by other awesome creations.</p>
            </div>
            <!-- right side -->
            <div class="col-6 right">
                <h1>Welcome to DnD Character Builder</h1>
                <form method="get" action="home.html" style="line-height: 20px;">
                    Don't have an account?
                    <a href="signup.html">Register</a>
                    <div class="mb-3">
                        <label for="exampleDropdownFormUsername" class="form-label">Username</label>
                        <input type="text" class="form-control" id="exampleDropdownFormUsername" placeholder="username" style="width: 50%">
                    </div>
                    <div class="mb-3">
                        <!-- add functionality for being able to show/hide password -->
                        <label for="exampleDropdownFormPassword1" class="form-label">Password</label>
                        <input type="password" class="form-control" id="exampleDropdownFormPassword1" placeholder="Password" style="width: 50%">
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="dropdownCheck">
                            <label class="form-check-label" for="dropdownCheck">Remember me</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg">Login</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <hr />
        <span class="text-reset">Josh Yamada</span>
        <br />
        <a href="https://github.com/Josh-Yamada16/CS260_Startup">GitHub</a>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</body>

</html>
