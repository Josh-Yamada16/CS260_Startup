<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DnD Character Builder</title>
    <link rel="icon" href="favicon.ico" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
    rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
    crossorigin="anonymous">

    <link rel="stylesheet" href="main.css" />
</head>

<body>
    <header>
        <h1>DnD Character Builder<sup></sup></h1>

        <!-- Navigation elements -->
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="home.html">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="build.html">Build</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="index.html">Logout</a>
            </li>
        </ul>

        <hr />
    </header>

    <main>
        <section class="notifications">
            <h2>Live Notifications</h2>
            <div class="notification-box" id="notificationBox">
                <p>Waiting for new character builds...</p>
            </div>
        </section>
        <br>

        <section class="gallery">
            <h2>Character Builds Gallery</h2>

            <div class="bd-example bd-example-placeholder-cards d-flex justify-content-around">
                <div class="card">
                    <svg class="bd-placeholder-img card-img-top" width="100%" height="180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder" preserveAspectRatio="xMidYMid slice" focusable="false">
                        <title>Placeholder</title>
                        <rect width="100%" height="100%" fill="#20c997"></rect>
                    </svg>

                    <div class="card-body">
                        <h5 class="card-title">Build 1</h5>
                        <p class="card-text">Some quick example text</p>
                        <a href="#" class="btn btn-primary">Go somewhere</a>
                    </div>
                </div>
                <div class="card" aria-hidden="true">
                    <svg class="bd-placeholder-img card-img-top" width="100%" height="180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder" preserveAspectRatio="xMidYMid slice" focusable="false">
                        <title>Placeholder</title>
                        <rect width="100%" height="100%" fill="#868e96"></rect>
                    </svg>

                    <div class="card-body">
                        <div class="h5 card-title placeholder-glow">
                            <span class="placeholder col-6"></span>
                        </div>
                        <p class="card-text placeholder-glow">
                            <span class="placeholder col-7"></span>
                            <span class="placeholder col-4"></span>
                            <span class="placeholder col-4"></span>
                            <span class="placeholder col-6"></span>
                            <span class="placeholder col-8"></span>
                        </p>
                        <a href="#" tabindex="-1" class="btn btn-primary disabled placeholder col-6"></a>
                    </div>
                </div>
            </div>
        </section>

        <div class="bd-example">
            <nav aria-label="Page navigation">
                <ul class="pagination">
                <li class="page-item"><a class="page-link" href="#">Previous</a></li>
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                <li class="page-item"><a class="page-link" href="#">Next</a></li>
                </ul>
            </nav>
        </div>
    </main>

    <footer>
        <hr />
        <span class="text-reset">Josh Yamada</span>
        <br />
        <a href="https://github.com/Josh-Yamada16/CS260_Startup">GitHub</a>

    </footer>
</body>

</html>
